aid: nexscope
name: Nexscope Ecommerce Data and Creative APIs
description: >-
  Nexscope is an ecommerce data and creative-AI platform for marketplace sellers.
  Its public REST + MCP surface exposes 225 skill operations spanning Amazon
  marketplace intelligence, keyword and search-demand research, TikTok/social
  commerce, Temu, Shopify, Etsy, Ozon, eBay, Shopee and 1688 data, patent/IP
  risk, and creative generation (studio product images, background removal,
  virtual try-on, and short-form product video) across model families such as
  Seedream, Seedance, Kling, Wan and GPT-Image. Authentication is a bearer
  Nexscope API key and usage is credit-based; data skills return synchronously
  while creative skills run as pollable async tasks. The same catalog is exposed
  to AI agents over a remote MCP endpoint.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/nexscope/refs/heads/main/apis.yml
created: '2026-09-16'
modified: '2026-09-16'
tags:
- E-Commerce
- Data
- Creative
- Artificial Intelligence
- Marketplace Intelligence
- Amazon
- TikTok
- Keyword Research
- Image Generation
- Video Generation
- MCP
