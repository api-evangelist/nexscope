note: >-
  Nexscope exposes the SAME skill catalog over REST and over MCP. Each REST
  operation is POST /api/skill-api/v1/skills/{skill}/run; the MCP server exposes
  one tool per skill. The live MCP tools/list is auth-gated (bearer API key), so
  exact tool names/inputSchemas could not be introspected; mappings below are by
  the documented 1:1 skill<->tool convention and are marked low/medium
  confidence accordingly. Each MCP tool inherits its backing operation's request
  body as its real inputSchema. Representative rows are given per category; the
  full mapping is the 225-operation set in the OpenAPI.
