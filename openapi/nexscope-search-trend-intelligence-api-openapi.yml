openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative Search & Trend…
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Search & Trend Intelligence
  description: Google Trends, AI mode search and web search APIs.
  x-category-slug: search-trend-intelligence
paths:
  /api/skill-api/v1/skills/google-ai-mode-search/run:
    post:
      tags:
      - Search & Trend Intelligence
      summary: Google AI Mode Search
      description: 'AI Overview (AI Mode) scraping via Google Search. Returns AI-summarized key points for a single keyword, ideal for deep research, technical Q&A, long-tail product selection, and cross-border consumer preference analysis using the latest web information. Single-round only; follow-ups require the agent to summarize context and issue a new request. Triggered by: Google AI, AI Overview, AI Mode, Google AI search, AI search, deep research, consumer preference analysis, web summary, long-tail product research, cross-border market insights.'
      operationId: runGoogleAiModeSearch
      externalDocs:
        description: Google AI Mode Search documentation
        url: https://www.nexscope.ai/api-docs/google-ai-mode-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.google-ai-mode-search.
              properties:
                keyword:
                  type: string
                  description: Google search keyword, passed as the q= parameter to initiate a Google AI Mode search. Only supports single-turn conversation; follow-up prompts are not supported. To ask follow-up questions, the agent must independently summarize key information from the previous AI overview, concatenate the new question, and send it as a new keyword in a new request
                  example: best phone case material for iPhone
              required:
              - keyword
              example:
                keyword: best phone case material for iPhone
              additionalProperties: true
            example:
              keyword: best phone case material for iPhone
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  stdout:
                    type: string
                    description: AI overview content in Markdown format; outputs key points and reference source links for each question's AI overview in order
                  sourceUrl:
                    type: string
                    description: Target URL that was crawled, the final Google search page URL
                    example: https://example.com/image.jpg
                  resultsNum:
                    type: integer
                    description: Number of AI overview blocks; >0 indicates the page rendered an AI Overview, 0 indicates the keyword did not trigger an AI Overview
                    example: 1
                  code:
                    type: string
                    description: Business status code, success is "200" (same as the numeric errcode)
                  errcode:
                    type: integer
                    description: Business status code (HTTP layer is generally 200; business success/failure is determined by this field)
                    example: 1
                  msg/errmsg:
                    type: string
                    description: Response message, ok on success
                  costTime:
                    type: integer
                    description: API latency in milliseconds
                    example: 1
                  costToken:
                    type: integer
                    description: Token consumption for this call; billed only when upstream returns success
                    example: 1
                  taskId:
                    type: string
                    description: Upstream capture task identifier for this request
                    example: example-id
                  type:
                    type: string
                    description: Render style, fixed stdoutWorkbenches, used with the stdout field for Markdown rendering
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  sourceUrl: https://example.com/image.jpg
                  resultsNum: 1
                  errcode: 1
                  costTime: 1
                  costToken: 1
                  taskId: example-id
                additionalProperties: true
              example:
                sourceUrl: https://example.com/image.jpg
                resultsNum: 1
                errcode: 1
                costTime: 1
                costToken: 1
                taskId: example-id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: google-ai-mode-search
      x-nexscope-mcp-tool-name: nexscope_google_ai_mode_search
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/google-trends-by-time/run:
    post:
      tags:
      - Search & Trend Intelligence
      summary: Google Trends By Time
      description: 'Query and analyze Google Trends real-time hot topics and trending searches for a specified time range and country/region. Triggered by: Google Trends, hot topics, real-time trending, popular trends, current hot searches, recent trending, viral topics, trending searches, trend discovery, market trends, what''s popular, trending now, breakout topics.'
      operationId: runGoogleTrendsByTime
      externalDocs:
        description: Google Trends By Time documentation
        url: https://www.nexscope.ai/api-docs/google-trends-by-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.google-trends-by-time.
              properties:
                days:
                  type: integer
                  description: 'Time range, query trend data for the last N days, default 7. Common values: 1, 2, 7'
                  example: 1
                region:
                  type: string
                  description: 'Country/region code, default US. Options: US, GB, JP, CA, MX, DE, FR, IT, ES, NL, AU, SG, AE, BR, IN, TR, PL, SE'
                  example: US
              example:
                days: 1
                region: US
              additionalProperties: true
            example:
              days: 1
              region: US
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  costToken:
                    type: integer
                    description: Token consumption
                    example: 1
                  chartOption:
                    type: object
                    description: Chart config object, containing visualization data
                    example: {}
                    properties:
                      data:
                        type: array
                        items: {}
                        description: Data, array of chart data point objects
                        example: []
                      fieldX:
                        type: string
                        description: X-axis field
                      fieldY:
                        type: array
                        items: {}
                        description: Y-axis fields
                        example: []
                      type:
                        type: string
                        description: Data type
                      title:
                        type: string
                        description: Title
                    additionalProperties: true
                  trendValues:
                    type: array
                    items:
                      type: object
                      properties:
                        query:
                          type: string
                          description: Keyword
                          example: phone case
                        searchVolume:
                          type: integer
                          description: Search volume value
                          example: 1
                        increasePercentage:
                          type: integer
                          description: 'Percentage increase: integer, range -100 to 100, unit is %'
                          example: 1
                        startTime:
                          type: string
                          description: Start timestamp
                        endTime:
                          type: string
                          description: End timestamp
                      additionalProperties: true
                    description: Trend values, array of trending query objects (see below)
                    example: []
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  costToken: 1
                  chartOption:
                    data: []
                    fieldY: []
                  trendValues:
                  - query: phone case
                    searchVolume: 1
                    increasePercentage: 1
                additionalProperties: true
              example:
                costToken: 1
                chartOption:
                  data: []
                  fieldY: []
                trendValues:
                - query: phone case
                  searchVolume: 1
                  increasePercentage: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: google-trends-by-time
      x-nexscope-mcp-tool-name: nexscope_google_trends_by_time
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/web-search/run:
    post:
      tags:
      - Search & Trend Intelligence
      summary: Web Search
      description: Web search, online retrieval, real-time information query, search engine search, Reddit and other community platform discussions, external site posts and trending topics.
      operationId: runWebSearch
      externalDocs:
        description: Web Search documentation
        url: https://www.nexscope.ai/api-docs/web-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.web-search.
              properties:
                keyword:
                  type: string
                  description: Search keyword, max length 1000 characters
                  example: phone case
              required:
              - keyword
              example:
                keyword: phone case
              additionalProperties: true
            example:
              keyword: phone case
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  searchList:
                    type: array
                    items:
                      type: object
                      properties:
                        score:
                          type: number
                          description: Result relevance score
                          example: 1
                        title:
                          type: string
                          description: Page title
                        url:
                          type: string
                          description: Page link
                          example: https://example.com/image.jpg
                        content:
                          type: string
                          description: Extracted page content
                      additionalProperties: true
                    description: Search result list
                    example: []
                  costToken:
                    type: integer
                    description: Token cost
                    example: 1
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  searchList:
                  - score: 1
                    url: https://example.com/image.jpg
                  costToken: 1
                additionalProperties: true
              example:
                searchList:
                - score: 1
                  url: https://example.com/image.jpg
                costToken: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: web-search
      x-nexscope-mcp-tool-name: nexscope_web_search
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
components:
  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonError'
    Forbidden:
      description: The account or API key is not allowed to use this capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonError'
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonError'
    ServerError:
      description: Server or upstream provider error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonError'
    TooManyRequests:
      description: Rate limit or account usage limit reached.
      headers:
        Retry-After:
          description: Retry delay when returned by the service.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonError'
  schemas:
    CommonError:
      type: object
      description: Common API error envelope. Exact fields may vary by endpoint and upstream provider.
      properties:
        code:
          oneOf:
          - type: integer
          - type: string
          description: Application or provider error code.
        msg:
          type: string
          description: Error message.
        message:
          type: string
          description: Alternative error message field.
        traceId:
          type: string
          description: Support trace identifier when available.
      additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Nexscope API Key
externalDocs:
  description: Nexscope API Documentation
  url: https://www.nexscope.ai/api-docs
x-nexscope-source: https://api.nexscope.ai/api/skill-api/v1/api-docs
x-nexscope-pricing-mode: dynamic-credits
x-nexscope-mcp-endpoint: https://api.nexscope.ai/api/skill-api/v1/mcp
