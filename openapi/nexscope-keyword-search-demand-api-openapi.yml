openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative Keyword & Search…
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Keyword & Search Demand
  description: Keyword expansion, search volume, share of voice and ranking intelligence.
  x-category-slug: keyword-search-demand
paths:
  /api/skill-api/v1/skills/amazon-asin-keywords/run:
    post:
      tags:
      - Keyword & Search Demand
      summary: Amazon Asin Keywords
      description: Use SIF data to reverse-lookup traffic keywords for any Amazon ASIN, including organic ranking, ad ranking, search volume, traffic share, organic/paid scores, ABA TOP3 click concentration, click conversion rate, year-over-year search volume changes, and weekly/monthly time windows.
      operationId: runAmazonAsinKeywords
      externalDocs:
        description: Amazon Asin Keywords documentation
        url: https://www.nexscope.ai/api-docs/amazon-asin-keywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-asin-keywords.
              properties:
                asin:
                  type: string
                  description: ASIN code, max length 1000 characters. This tool can only query one ASIN at a time
                  example: B072MQ5BRX
                country:
                  type: string
                  description: 'Country site, default US. Options (13 total): US, UK, DE, CA, JP, FR, ES, IT, MX, AU, AE, BR, SA'
                keyword:
                  type: string
                  description: Keyword, max length 1000. Translate to the corresponding country's language whenever possible
                  example: phone case
                timePieceType:
                  type: string
                  description: 'Time slice type, default latelyDay. Options: latelyDay (last N days), month (a specific month), week (a specific week)'
                timePieceValue:
                  type: string
                  description: Time slice value, default 7, max length 1000. For latelyDay only 7 or 30; for month format YYYY-MM (e.g. 2026-04); for week format week start date YYYY-MM-DD (e.g. 2026-04-13)
                conditions:
                  type: string
                  description: 'Condition filters, comma-separated. Options:<br>Flag type: nfPosition (natural traffic keyword), isSpAd (SP ad keyword), isBrandAd (brand ad keyword), isVedioAd (video ad keyword), isAC (AC recommended keyword), isAccurateKw (precise traffic keyword), isAccurateTailKw (precise long-tail keyword), isPurchaseKw (converting keyword), isQualityKw (high-quality conversion keyword), isStableKw (stable conversion keyword), isLossKw (lost conversion keyword), isInvalidKw (invalid impression keyword), isMultiVariantKw (multi-variant natural rank keyword), isSearchVolUpKw (search volume YoY growth keyword), isSearchVolDownKw (search volume YoY decline keyword)<br>Period count type (.total all / .in new): totalPeriod.in, nfKeywordCnt.total, nfKeywordCnt.in, adKeywordCnt.total, adKeywordCnt.in, allSpKeywordCnt.total, allSpKeywordCnt.in, spKeywordCnt.total, spKeywordCnt.in, recSpKeywordCnt.total, recSpKeywordCnt.in, allSbKeywordCnt.total, allSbKeywordCnt.in, sbKeywordCnt.total, sbKeywordCnt.in, sbvKeywordCnt.total, sbvKeywordCnt.in'
                sortBy:
                  type: string
                  description: 'Sort field. Options: lastRank (natural rank), adLastRank (ad rank), updateTime (keyword crawl time), searchesRank (search rank), estSearchesNum (monthly search volume). Empty string means default system sort'
                desc:
                  type: boolean
                  description: Whether to sort descending, default true
                  example: false
                pageNum:
                  type: integer
                  description: Page number, default 1
                  example: 1
                pageSize:
                  type: integer
                  description: Results per page, min 10, max 100, default 100
                  example: 10
              required:
              - asin
              example:
                asin: B072MQ5BRX
                pageSize: 10
                desc: true
                pageNum: 1
                country: US
              additionalProperties: true
            example:
              asin: B072MQ5BRX
              pageSize: 10
              desc: true
              pageNum: 1
              country: US
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  code:
                    type: string
                    description: Response code
                  msg:
                    type: string
                    description: Message
                  total:
                    type: integer
                    description: Number of data records actually returned
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        keyword:
                          type: string
                          description: Keyword
                          example: phone case
                        translateKeyword:
                          type: string
                          description: Keyword translation, localized translation for the site
                          example: phone case
                        asin:
                          type: string
                          description: Product ASIN
                          example: B072MQ5BRX
                        productNaturalRank:
                          type: integer
                          description: Product natural search rank. The position ranking of this product in natural search results for this keyword, e.g. 1 means ranked 1st (top position) in search results
                          example: 1
                        naturalRankDisplay:
                          type: string
                          description: Natural rank display text. String representation of natural search rank
                        productAdRank:
                          type: integer
                          description: Product SP ad rank. The ranking position of this product in Sponsored Products ad placements for this keyword, e.g. 3 means ranked 3rd in ad placement
                          example: 1
                        adRankDisplay:
                          type: string
                          description: Ad rank display text. String representation of SP ad rank
                        weeklySearchVolume:
                          type: integer
                          description: Weekly search volume. Estimated weekly search count for this keyword on Amazon
                          example: 1
                        keywordPopularityRank:
                          type: integer
                          description: Keyword search popularity rank. This keyword's monthly search volume ranking among all Amazon keywords; lower values indicate higher search volume
                          example: 1
                        totalSearchResultProductCount:
                          type: integer
                          description: Total search result product count for this keyword (active listings)
                          example: 1
                        trafficShare:
                          type: number
                          description: Traffic share. Proportion of traffic this keyword brings to the product out of all keywords' total traffic, where 1 = 100%
                          example: 1
                        naturalTrafficShare:
                          type: number
                          description: Natural traffic score share. Natural search traffic score / total score
                          example: 1
                        paidTrafficShare:
                          type: number
                          description: Paid ad traffic score share. Ad traffic score / total score; ad total = sp + sb + sbv + recAd
                          example: 1
                        naturalTrafficScore:
                          type: number
                          description: Natural traffic score. Natural search exposure score this keyword brings to this ASIN; 0 = no natural traffic exposure
                          example: 1
                        sponsoredProductsScore:
                          type: number
                          description: SP ad regular score. Traffic score for Sponsored Products regular placements (excluding SP recommendation placements)
                          example: 1
                        brandAdScore:
                          type: number
                          description: SB brand ad score. Traffic score for Sponsored Brands brand ads (regular + video, combined)
                          example: 1
                        videoAdScore:
                          type: number
                          description: SBV video ad score. Traffic score for Sponsored Brands Video video ads
                          example: 1
                        sponsoredRecommendationScore:
                          type: number
                          description: SP recommendation placement score. Combined score for Trending now / Seen on social media / Customers frequently viewed / 4 stars and above, etc.
                          example: 1
                        sponsoredRecommendationBreakdown:
                          type: array
                          items: {}
                          description: SP recommendation placement score breakdown. Each entry {title, score, scoreRatio}
                          example: []
                        clickConcentrationShare:
                          type: number
                          description: ABA TOP3 click concentration. Measures whether clicks are concentrated on top ASINs; note this is not conversion rate
                          example: 1
                        clickToPurchaseConversionRate:
                          type: number
                          description: Click-to-purchase conversion rate (purchaseQty / clickQty)
                          example: 1
                        displayPositionTypes:
                          type: array
                          items: {}
                          description: 'Product display position type array. May contain: natural=natural search result position; ac=Amazon''s Choice recommendation position; sp=Sponsored Products ad position; top=top-of-page brand ad position; bottom=bottom-of-page brand ad position; er=Editorial Recommendations position; vedio=video ad position; tr=Top Rated recommendation position; trfob=Top Rated Frequently Bought recommendation position'
                          example: []
                        trafficCharacteristicMarkers:
                          type: array
                          items: {}
                          description: 'Keyword traffic characteristic marker array. May contain: isMainKw=main traffic keyword; isAccurateKw=precise traffic keyword; isAccurateAboveKw=precise broad keyword; isAccurateTailKw=precise long-tail keyword'
                          example: []
                        conversionPerformanceMarkers:
                          type: array
                          items: {}
                          description: 'Conversion performance marker array. May contain: isPurchaseKw=converting keyword; isQualityKw=high-quality conversion keyword; isStableKw=stable conversion keyword; isLossKw=lost conversion keyword; isInvalidKw=invalid impression keyword'
                          example: []
                        lastNaturalRankTime:
                          type: string
                          description: Time of the most recent valid natural rank
                        lastAdRankTime:
                          type: string
                          description: Time of the most recent valid SP ad rank
                        periodEndDate:
                          type: string
                          description: Current period (weekly granularity) end date = start week + 7 days (site time)
                          example: '2026-01-01'
                        updateTime:
                          type: string
                          description: Keyword data update time
                          example: '2026-01-01'
                      additionalProperties: true
                    description: Data array (see below)
                    example: []
                  columns:
                    type: array
                    items: {}
                    description: Render columns
                    example: []
                  type:
                    type: string
                    description: Render style
                  title:
                    type: string
                    description: Title
                  isParentAsin:
                    type: boolean
                    description: Whether it is a parent ASIN (pasin)
                    example: false
                  hasVaiants:
                    type: boolean
                    description: Whether it has variants
                    example: false
                  abaCreateDateWeek:
                    type: string
                    description: Week date corresponding to the latest weekly ABA data
                    example: '2026-01-01'
                  costTime:
                    type: integer
                    description: Latency (ms)
                    example: 1
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  message:
                    type: string
                    description: Provider-specific message.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  total: 1
                  data:
                  - keyword: phone case
                    translateKeyword: phone case
                    asin: B072MQ5BRX
                    productNaturalRank: 1
                    productAdRank: 1
                    weeklySearchVolume: 1
                    keywordPopularityRank: 1
                    totalSearchResultProductCount: 1
                    trafficShare: 1
                    naturalTrafficShare: 1
                    paidTrafficShare: 1
                    naturalTrafficScore: 1
                    sponsoredProductsScore: 1
                    brandAdScore: 1
                    videoAdScore: 1
                    sponsoredRecommendationScore: 1
                    sponsoredRecommendationBreakdown: []
                    clickConcentrationShare: 1
                    clickToPurchaseConversionRate: 1
                    displayPositionTypes: []
                    trafficCharacteristicMarkers: []
                    conversionPerformanceMarkers: []
                    periodEndDate: '2026-01-01'
                    updateTime: '2026-01-01'
                  columns: []
                  isParentAsin: false
                  hasVaiants: false
                  abaCreateDateWeek: '2026-01-01'
                  costTime: 1
                  costToken: 1
                additionalProperties: true
              example:
                total: 1
                data:
                - keyword: phone case
                  translateKeyword: phone case
                  asin: B072MQ5BRX
                  productNaturalRank: 1
                  productAdRank: 1
                  weeklySearchVolume: 1
                  keywordPopularityRank: 1
                  totalSearchResultProductCount: 1
                  trafficShare: 1
                  naturalTrafficShare: 1
                  paidTrafficShare: 1
                  naturalTrafficScore: 1
                  sponsoredProductsScore: 1
                  brandAdScore: 1
                  videoAdScore: 1
                  sponsoredRecommendationScore: 1
                  sponsoredRecommendationBreakdown: []
                  clickConcentrationShare: 1
                  clickToPurchaseConversionRate: 1
                  displayPositionTypes: []
                  trafficCharacteristicMarkers: []
                  conversionPerformanceMarkers: []
                  periodEndDate: '2026-01-01'
                  updateTime: '2026-01-01'
                columns: []
                isParentAsin: false
                hasVaiants: false
                abaCreateDateWeek: '2026-01-01'
                costTime: 1
                costToken: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: amazon-asin-keywords
      x-nexscope-mcp-tool-name: nexscope_amazon_asin_keywords
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/amazon-keyword-expansion/run:
    post:
      tags:
      - Keyword & Search Demand
      summary: Amazon Keyword Expansion
      description: Jungle Scout keyword expansion tool that expands a seed keyword into a list of related keywords with search volume, trends, PPC bids, ranking difficulty, and other metrics, covering 10 Amazon marketplaces including US, UK, DE, JP, etc.
      operationId: runAmazonKeywordExpansion
      externalDocs:
        description: Amazon Keyword Expansion documentation
        url: https://www.nexscope.ai/api-docs/amazon-keyword-expansion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-keyword-expansion.
              properties:
                marketplace:
                  type: string
                  description: 'Target marketplace code. Options: us, uk, de, in, ca, fr, it, es, mx, jp. Default us'
                  example: us
                searchTerms:
                  type: string
                  description: Seed keyword (single keyword string)
                  example: phone case
                needCount:
                  type: integer
                  description: Total number of results returned
                  example: 10
                sort:
                  type: string
                  description: Sort field, default -monthly_search_volume_exact (exact search volume descending)
                minMonthlySearchVolumeExact:
                  type: integer
                  description: Minimum exact search volume
                  example: 1
                maxMonthlySearchVolumeExact:
                  type: integer
                  description: Maximum exact search volume
                  example: 1
                minMonthlySearchVolumeBroad:
                  type: integer
                  description: Minimum broad search volume
                  example: 1
                maxMonthlySearchVolumeBroad:
                  type: integer
                  description: Maximum broad search volume
                  example: 1
                minWordCount:
                  type: integer
                  description: Minimum word count for keywords (for filtering long-tail keywords)
                  example: 1
                maxWordCount:
                  type: integer
                  description: Maximum word count for keywords
                  example: 1
                minOrganicProductCount:
                  type: integer
                  description: Minimum organic product count
                  example: 1
                maxOrganicProductCount:
                  type: integer
                  description: Maximum organic product count
                  example: 1
              required:
              - marketplace
              - searchTerms
              example:
                needCount: 10
                searchTerms: phone case
                marketplace: us
              additionalProperties: true
            example:
              needCount: 10
              searchTerms: phone case
              marketplace: us
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  keywordInfoList:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Keyword name
                        country:
                          type: string
                          description: Marketplace code
                        monthlySearchVolumeExact:
                          type: integer
                          description: Monthly average exact match search volume
                          example: 1
                        monthlySearchVolumeBroad:
                          type: integer
                          description: Monthly average broad match search volume
                          example: 1
                        monthlyTrend:
                          type: number
                          description: Monthly search volume change percentage
                          example: 1
                        quarterlyTrend:
                          type: number
                          description: Quarterly search volume change percentage
                          example: 1
                        dominantCategory:
                          type: string
                          description: Category with the highest share in search results
                        relevancyScore:
                          type: integer
                          description: Relevance score to the seed keyword
                          example: 1
                        easeOfRankingScore:
                          type: integer
                          description: Ease of ranking score (higher means easier to rank)
                          example: 1
                        organicProductCount:
                          type: integer
                          description: Number of organic ranking products
                          example: 1
                        sponsoredProductCount:
                          type: integer
                          description: Number of sponsored products
                          example: 1
                        ppcBidExact:
                          type: number
                          description: Exact match PPC suggested bid (USD)
                          example: 1
                        ppcBidBroad:
                          type: number
                          description: Broad match PPC suggested bid (USD)
                          example: 1
                        spBrandAdBid:
                          type: number
                          description: Sponsored Brand ad suggested bid (USD)
                          example: 1
                        recommendedPromotions:
                          type: integer
                          description: Number of recommended promotion giveaways
                          example: 1
                      additionalProperties: true
                    description: Keyword information list
                    example: []
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  costToken: 1
                  keywordInfoList:
                  - monthlySearchVolumeExact: 1
                    monthlySearchVolumeBroad: 1
                    monthlyTrend: 1
                    quarterlyTrend: 1
                    relevancyScore: 1
                    easeOfRankingScore: 1
                    organicProductCount: 1
                    sponsoredProductCount: 1
                    ppcBidExact: 1
                    ppcBidBroad: 1
                    spBrandAdBid: 1
                    recommendedPromotions: 1
                additionalProperties: true
              example:
                costToken: 1
                keywordInfoList:
                - monthlySearchVolumeExact: 1
                  monthlySearchVolumeBroad: 1
                  monthlyTrend: 1
                  quarterlyTrend: 1
                  relevancyScore: 1
                  easeOfRankingScore: 1
                  organicProductCount: 1
                  sponsoredProductCount: 1
                  ppcBidExact: 1
                  ppcBidBroad: 1
                  spBrandAdBid: 1
                  recommendedPromotions: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: amazon-keyword-expansion
      x-nexscope-mcp-tool-name: nexscope_amazon_keyword_expansion
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/amazon-keyword-intelligence/run:
    post:
      tags:
      - Keyword & Search Demand
      summary: Amazon Keyword Intelligence
      description: Query and analyze Amazon ABA (Brand Analytics) search term data, covering 15 marketplaces with nearly 3 years of weekly data.
      operationId: runAmazonKeywordIntelligence
      externalDocs:
        description: Amazon Keyword Intelligence documentation
        url: https://www.nexscope.ai/api-docs/amazon-keyword-intelligence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-keyword-intelligence.
              properties:
                analysisDescription:
                  type: string
                  description: Natural language description that precisely expresses the query intent
                  example: Analyze Amazon Brand Analytics search demand for phone case in the US marketplace
                region:
                  type: string
                  description: 'Site code, default US. Options: US, DE, BR, CA, AU, JP, AE, ES, FR, IT, SA, TR, MX, SE, NL'
                  example: US
                createDownloadUrl:
                  type: boolean
                  description: Whether to generate a CSV download link, default false
                  example: false
              required:
              - analysisDescription
              example:
                region: US
                createDownloadUrl: false
                analysisDescription: Find Amazon Brand Analytics search demand for phone case in the US marketplace
              additionalProperties: true
            example:
              region: US
              createDownloadUrl: false
              analysisDescription: Find Amazon Brand Analytics search demand for phone case in the US marketplace
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  success:
                    type: boolean
                    description: Whether the query succeeded
                    example: false
                  tables:
                    type: array
                    items: {}
                    description: Result data array, each element containing data (data rows), columns (column definitions), name (Sheet name)
                    example: []
                  total:
                    type: integer
                    description: Total result count
                    example: 1
                  downloadUrl:
                    type: string
                    description: When createDownloadUrl is true, returns the CSV file URL
                    example: https://example.com/image.jpg
                  msg:
                    type: string
                    description: Additional message
                  downloadNote:
                    type: string
                    description: Download-related note
                  code:
                    type: string
                    description: Response code
                  costTime:
                    type: integer
                    description: Latency (ms)
                    example: 1
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  message:
                    type: string
                    description: Provider-specific message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  success: false
                  tables: []
                  total: 1
                  downloadUrl: https://example.com/image.jpg
                  costTime: 1
                  costToken: 1
                additionalProperties: true
              example:
                success: false
                tables: []
                total: 1
                downloadUrl: https://example.com/image.jpg
                costTime: 1
                costToken: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: amazon-keyword-intelligence
      x-nexscope-mcp-tool-name: nexscope_amazon_keyword_intelligence
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/amazon-keyword-overview/run:
    post:
      tags:
      - Keyword & Search Demand
      summary: Amazon Keyword Overview
      description: SIF overview analysis of Amazon keyword market competition.
      operationId: runAmazonKeywordOverview
      externalDocs:
        description: Amazon Keyword Overview documentation
        url: https://www.nexscope.ai/api-docs/amazon-keyword-overview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-keyword-overview.
              properties:
                keyword:
                  type: string
                  description: 'Keyword, translate to the corresponding country''s language whenever possible. Max length: 1000 characters'
                  example: phone case
                country:
                  type: string
                  description: 'Country site, default US. Options (13 total): US, UK, DE, CA, JP, FR, ES, IT, MX, AU, AE, BR, SA'
                last7d:
                  type: boolean
                  description: Whether to get last 7 days data, default true. When false, use startDate/endDate range
                  example: true
                startDate:
                  type: string
                  description: Start date yyyy-MM-dd (effective when last7d=false)
                  example: '2026-01-01'
                endDate:
