openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative Multimodal AI API
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Multimodal AI
  description: Image recognition, image editing, image generation, and ecommerce creative APIs.
  x-category-slug: multimodal-ai
paths:
  /api/skill-api/v1/skills/ai-model-swap/run:
    post:
      tags:
      - Multimodal AI
      summary: AI Model Swap API
      description: Generate model images by combining a source product image with a model head image, optional masks, scene references, and prompt guidance.
      operationId: runAiModelSwap
      externalDocs:
        description: AI Model Swap API documentation
        url: https://www.nexscope.ai/api-docs/ai-model-swap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Generate model images by combining a source product image with a model head image, optional masks, scene references, and prompt guidance.
              properties:
                imageUrl:
                  type: string
                  description: Public URL of the source product or outfit image. The image must be up to 20 MB and between 385 and 8192 pixels in both width and height.
                  example: https://example.com/source-image.jpg
                modelHeadImageUrl:
                  type: string
                  description: Public URL of the target model head image. The image must be up to 5 MB and between 512 and 2048 pixels in both width and height.
                  example: https://example.com/model-reference.jpg
                imageSegUrl:
                  type: string
                  description: Optional segmentation mask URL for the source image.
                  example: https://example.com/mask.png
                sceneImgUrl:
                  type: string
                  description: Optional scene reference image URL. The image must be up to 10 MB and between 768 and 4096 pixels in both width and height.
                  example: https://example.com/scene.jpg
                sceneStrength:
                  type: number
                  description: Scene reference strength from 0 to 1. Defaults to 0.7.
                  example: 0.7
                modelPrompt:
                  type: string
                  description: Comma-separated model appearance terms, such as smile, laugh, sitting, lying, fat, plump, slim, sideways, profile, back, or bald.
                  example: smile, slim
                customPrompt:
                  type: string
                  description: Positive generation prompt, up to 600 characters.
                  example: clean ecommerce catalog photo
                customNegPrompt:
                  type: string
                  description: Negative prompt to avoid unwanted artifacts.
                  example: blur, distorted hands
                genOriRes:
                  type: boolean
                  description: Whether to generate the original resolution. Defaults to false.
                  example: false
                realModel:
                  type: boolean
                  description: Whether to prefer a realistic model style.
                  example: true
                outputNum:
                  type: integer
                  description: Number of images to generate, from 1 to 4. Defaults to 1.
                  example: 1
              required:
              - imageUrl
              - modelHeadImageUrl
              example:
                imageUrl: https://example.com/source-image.jpg
                modelHeadImageUrl: https://example.com/model-reference.jpg
                imageSegUrl: https://example.com/mask.png
                sceneImgUrl: https://example.com/scene.jpg
                sceneStrength: 0.7
                modelPrompt: smile, slim
                customPrompt: clean ecommerce catalog photo
                customNegPrompt: blur, distorted hands
                genOriRes: false
                realModel: true
                outputNum: 1
              additionalProperties: true
            example:
              imageUrl: https://example.com/source-image.jpg
              modelHeadImageUrl: https://example.com/model-reference.jpg
              imageSegUrl: https://example.com/mask.png
              sceneImgUrl: https://example.com/scene.jpg
              sceneStrength: 0.7
              modelPrompt: smile, slim
              customPrompt: clean ecommerce catalog photo
              customNegPrompt: blur, distorted hands
              genOriRes: false
              realModel: true
              outputNum: 1
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Creates a Nexscope asynchronous generation task. Use taskId with the task result endpoint to retrieve the completed output. The completed result replaces generated resource URLs with Nexscope-hosted URLs and replaces provider count with actual Nexscope credits charged.
                properties:
                  taskId:
                    type: string
                    description: Nexscope asynchronous task id used to query the generation result.
                    example: 6b3f1c61-1b7d-4a59-8a7d-3b23e4b0c9e2
                  status:
                    type: string
                    description: Task status. Initial run returns PENDING; the query endpoint may return PENDING, RUNNING, SUCCESS, FAILED, or TIMEOUT.
                    example: PENDING
                  message:
                    type: string
                    description: User-facing task state message.
                    example: The task has been created. Use taskId to query the result.
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costToken:
                    type: integer
                    description: Token cost reported by the upstream provider.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                required:
                - taskId
                - status
                example:
                  taskId: 6b3f1c61-1b7d-4a59-8a7d-3b23e4b0c9e2
                  status: PENDING
                  message: The task has been created. Use taskId to query the result.
                additionalProperties: true
              example:
                taskId: 6b3f1c61-1b7d-4a59-8a7d-3b23e4b0c9e2
                status: PENDING
                message: The task has been created. Use taskId to query the result.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: ai-model-swap
      x-nexscope-mcp-tool-name: nexscope_ai_model_swap
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
