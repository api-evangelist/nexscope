      tags:
      - Temu Marketplace Intelligence
      summary: GeekBI Temu Image Search
      description: Execute the selected image search operation and preserve provider business fields and extensions.
      operationId: runGeekbiTemuGoodsImageSearch
      externalDocs:
        description: GeekBI Temu Image Search documentation
        url: https://www.nexscope.ai/api-docs/geekbi-temu-goods-image-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                imageUrl:
                  type: string
                  description: Provider OSS temporary image URL, obtained through presignedPut and a successful PUT upload with the signature query removed. Replace the example.invalid placeholder before calling; external URLs are rejected upstream. Actual image must be at most 10 MB and JPEG, PNG, GIF, WebP or BMP.
                  minLength: 1
                  maxLength: 2048
                  format: uri
                contentType:
                  type: string
                  description: Must match OSS response and actual image bytes; omitted means server detection.
                  maxLength: 100
                  enum:
                  - image/jpeg
                  - image/png
                  - image/gif
                  - image/webp
                  - image/bmp
              required:
              - imageUrl
            example:
              imageUrl: https://example.invalid/replace-with-provider-oss-image
              contentType: image/jpeg
