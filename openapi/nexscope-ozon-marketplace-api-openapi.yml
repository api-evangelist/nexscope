openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative Ozon Marketplace API
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Ozon Marketplace
  description: Ozon product, category, shop, seller and keyword APIs.
  x-category-slug: ozon-marketplace
paths:
  /api/skill-api/v1/skills/ozon-brand-products/run:
    post:
      tags:
      - Ozon Marketplace
      summary: Ozon Brand Products
      description: 'MPSTATS Ozon Russia brand drill-down product list. Returns all products under an Ozon brand display name (Russian/Latin) with complete metrics: sales, revenue, price, rating, stock, turnover, lost revenue, supporting multi-dimensional numeric filters, sorting, and currency conversion. Use for brand benchmarking, competitor analysis, brand product structure research, SKU-level bestseller analysis.'
      operationId: runOzonBrandProducts
      externalDocs:
        description: Ozon Brand Products documentation
        url: https://www.nexscope.ai/api-docs/ozon-brand-products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.ozon-brand-products.
              properties:
                brandName:
                  type: string
                  description: Ozon brand display name (Russian or Latin)
                  example: COMMO
                startDate:
                  type: string
                  description: Statistics start date, YYYY-MM-DD; latest is yesterday
                  example: '2026-01-01'
                endDate:
                  type: string
                  description: Statistics end date, YYYY-MM-DD; latest is yesterday
                  example: '2026-01-01'
                page:
                  type: integer
                  description: Page number, starting from 1
                  example: 1
                pageSize:
                  type: integer
                  description: Rows per page, 1-100, default 100
                  example: 10
                sortField:
                  type: string
                  description: Sort column name (snake_case), e.g., sales, revenue, final_price, balance, rating
                sortDirection:
                  type: string
                  description: asc ascending / desc descending
                currency:
                  type: string
                  description: Currency code for result amounts, default RUB, e.g., USD / EUR / CNY
                currencyRate:
                  type: integer
                  description: Custom exchange rate (for non-default currency)
                  example: 1
                includeFbs:
                  type: boolean
                  description: Whether to include FBS data
                  example: false
                filters:
                  type: array
                  items: {}
                  description: List of numeric filter conditions, each {field, op, value, value2?}, multiple conditions AND
                  example: []
              required:
              - brandName
              example:
                startDate: '2026-01-01'
                currencyRate: 1
                brandName: COMMO
                page: 1
                endDate: '2026-01-31'
                pageSize: 10
                includeFbs: false
              additionalProperties: true
            example:
              startDate: '2026-01-01'
              currencyRate: 1
              brandName: COMMO
              page: 1
              endDate: '2026-01-31'
              pageSize: 10
              includeFbs: false
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  code:
                    type: string
                    description: Return code, "200" success
                  msg:
                    type: string
                    description: Message; ok for success
                  total:
                    type: integer
                    description: Total number of matched products under the brand
                    example: 1
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: integer
                          description: SKU ID
                          example: 1
                        title:
                          type: string
                          description: Product name (Russian)
                        brand:
                          type: string
                          description: Brand
                        brandId:
                          type: integer
                          description: Brand ID
                          example: 1
                        sellerName:
                          type: string
                          description: Seller name
                        sellerId:
                          type: integer
                          description: Seller ID
                          example: 1
                        category:
                          type: string
                          description: Category path (Russian, / separated)
                        nicheName:
                          type: string
                          description: Niche path (Russian)
                        nicheId:
                          type: integer
                          description: Niche ID
                          example: 1
                        country:
                          type: string
                          description: Country of sale, always RU for Ozon
                        firstDate:
                          type: string
                          description: Listing date (yyyy-MM-dd)
                          example: '2026-01-01'
                        imageUrl:
                          type: string
                          description: Main image URL
                          example: https://example.com/image.jpg
                        productPageUrl:
                          type: string
                          description: Product page URL
                          example: https://example.com/image.jpg
                        sourceTool/sourceType:
                          type: string
                          description: Source tool / data source identifier
                        price:
                          type: number
                          description: Current selling price
                          example: 1
                        oldPrice:
                          type: number
                          description: Original price before discount
                          example: 1
                        ozonCardPrice:
                          type: number
                          description: Ozon Card price
                          example: 1
                        minPrice/maxPrice/averagePrice:
                          type: number
                          description: Minimum / maximum / average price during the statistics period
                          example: 1
                        currency:
                          type: string
                          description: Currency symbol (₽ / $ / €)
                        rating:
                          type: number
                          description: Rating, 0-5
                          example: 1
                        reviewCount:
                          type: integer
                          description: Number of reviews
                          example: 1
                        balance:
                          type: integer
                          description: Current stock (units)
                          example: 1
                        balanceFbs:
                          type: integer
                          description: FBS stock (seller self-ship units)
                          example: 1
                        frozenStocks:
                          type: integer
                          description: Slow-moving stock
                          example: 1
                        warehousesCount:
                          type: integer
                          description: Number of FBO warehouses
                          example: 1
                        isFbs:
                          type: boolean
                          description: Whether shipped via FBS
                          example: false
                        salesPerDay:
                          type: number
                          description: Average daily sales (units/day)
                          example: 1
                        monthlySalesUnits:
                          type: integer
                          description: Sales volume during the statistics period (units)
                          example: 1
                        monthlySalesRevenue:
                          type: number
                          description: Sales revenue during the statistics period
                          example: 1
                        lostProfit:
                          type: number
                          description: Lost revenue (due to stockouts, etc.)
                          example: 1
                        daysInSite:
                          type: integer
                          description: Days on sale (statistics period, including out-of-stock days)
                          example: 1
                        daysInStock:
                          type: integer
                          description: Days in stock
                          example: 1
                        turnoverDays:
                          type: number
                          description: Turnover days (lower is faster)
                          example: 1
                        position:
                          type: integer
                          description: Ranking within the current query dimension (brand for this endpoint)
                          example: 1
                        categoryPosition:
                          type: integer
                          description: Ranking within the category
                          example: 1
                        revenueSharePercent:
                          type: number
                          description: Revenue share of this SKU within the current query dimension, 0-100
                          example: 1
                      additionalProperties: true
                    description: Product list (see details below)
                    example: []
                  columns:
                    type: array
                    items: {}
                    description: Rendered column definitions
                    example: []
                  costTime:
                    type: integer
                    description: API latency (milliseconds)
                    example: 1
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  type:
                    type: string
                    description: Response type
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  message:
                    type: string
                    description: Provider-specific message.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  total: 1
                  products:
                  - productId: 1
                    brandId: 1
                    sellerId: 1
                    nicheId: 1
                    firstDate: '2026-01-01'
                    imageUrl: https://example.com/image.jpg
                    productPageUrl: https://example.com/image.jpg
                    price: 1
                    oldPrice: 1
                    ozonCardPrice: 1
                    minPrice/maxPrice/averagePrice: 1
                    rating: 1
                    reviewCount: 1
                    balance: 1
                    balanceFbs: 1
                    frozenStocks: 1
                    warehousesCount: 1
                    isFbs: false
                    salesPerDay: 1
                    monthlySalesUnits: 1
                    monthlySalesRevenue: 1
                    lostProfit: 1
                    daysInSite: 1
                    daysInStock: 1
                    turnoverDays: 1
                    position: 1
                    categoryPosition: 1
                    revenueSharePercent: 1
                  columns: []
                  costTime: 1
                  costToken: 1
                additionalProperties: true
              example:
                total: 1
                products:
                - productId: 1
                  brandId: 1
                  sellerId: 1
                  nicheId: 1
                  firstDate: '2026-01-01'
                  imageUrl: https://example.com/image.jpg
                  productPageUrl: https://example.com/image.jpg
