  /api/skill-api/v1/skills/ozon-category-search/run:
    post:
      tags:
      - Ozon Marketplace
      summary: Ozon Category Search
      description: 'Seerfar Ozon category product search: fetches the product list for a given Ozon category ID, returning category-level aggregates (total sales, total revenue, average price, average rating, seasonality) and per-product sales, price, rating, review count, brand, seller, and fulfillment method. Use for category selection analysis, category bestseller mining, category capacity and price band analysis, seasonality assessment.'
      operationId: runOzonCategorySearch
      externalDocs:
        description: Ozon Category Search documentation
        url: https://www.nexscope.ai/api-docs/ozon-category-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.ozon-category-search.
              properties:
                categoryId:
                  type: string
                  description: Ozon category ID, obtained from Ozon category documentation or other Seerfar Ozon tools. Format like 15621032_15621049_115951147 (multi-level categories joined by _)
                  example: '15621042_17028650_97011'
                page:
                  type: object
                  description: 'Pagination & sorting: {page, pageSize, orders[]}'
                  example:
                    page: 1
                    pageSize: 10
                  properties:
                    page:
                      type: integer
                      description: Page number, starting from 1, default 1
                      example: 1
                    pageSize:
                      type: integer
                      description: Items per page, default 20, maximum 20 (exceeding returns errcode 1002)
                      example: 1
                    orders:
                      type: array
                      items: {}
                      description: 'Sort rules, elements {field, direction} (both required); direction takes DESC (descending) / ASC (ascending). Common sort fields: sales, price, revenue, reviewRating'
                      example: []
                  additionalProperties: true
                date:
                  type: string
                  description: Query historical month, format yyyy-MM (e.g., 2026-02); defaults to last 30 days if omitted
                  example: 2026-01
                fulfillment:
                  type: string
                  description: 'Fulfillment method filter, fixed options: FBO, FBS, RFBS, FBP, OZON; queries all if omitted. Note: single string, not an array'
                uId:
                  type: string
                  description: User ID (max 1000)
                  example: example-id
                memberId:
                  type: string
                  description: Member ID (a unique member identifier; a user can belong to multiple teams; data is attributed to memberId, max 1000)
                  example: example-id
              required:
              - categoryId
              - page
              example:
                page:
                  page: 1
                  pageSize: 10
                categoryId: '15621042_17028650_97011'
                date: 2026-01
              additionalProperties: true
            example:
              page:
                page: 1
                pageSize: 10
              categoryId: '15621042_17028650_97011'
              date: 2026-01
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  code:
                    type: string
                    description: Return code, "200" indicates success (returned on success)
                  errcode:
                    type: integer
                    description: Error code, 200 indicates success; only returned on business errors (coexists with code on success)
                    example: 1
                  msg:
                    type: string
                    description: Message; ok for success
                  errmsg:
                    type: string
                    description: Error message; ok for success, reason description on business error
                  id:
                    type: string
                    description: Echoed category ID
                    example: example-id
                  total:
                    type: integer
                    description: Number of records returned on this page (equals the current page data count, not total category product count)
                    example: 1
                  totalSales:
