openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative Image Generation…
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Image Generation Models
  description: Dedicated image generation APIs with one fixed model per endpoint.
  x-category-slug: image-generation-models
paths:
  /api/skill-api/v1/skills/banana-image-generation/run:
    post:
      tags:
      - Image Generation Models
      summary: Nano Banana Image Generation
      description: Generate ecommerce images with the Nano Banana base image model. The model is fixed by this API, so provider must not be supplied in the request.
      operationId: runBananaImageGeneration
      externalDocs:
        description: Nano Banana Image Generation documentation
        url: https://www.nexscope.ai/api-docs/banana-image-generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Generate ecommerce images with the Nano Banana base image model.
              properties:
                imageUrls:
                  type: array
                  items:
                    type: string
                  description: Public reference image URLs required by this image generation API. When supplied, provide 1 to 10 JPG, PNG, or WEBP images; each image must not exceed 20 MB.
                  example:
                  - https://example.com/product.jpg
                  minItems: 1
                  maxItems: 10
                prompt:
                  type: string
                  description: Generation prompt describing the target image, scene, composition, style, and constraints. Maximum 5000 characters.
                  example: Keep the product consistent and generate a clean white-background ecommerce hero image.
                  maxLength: 5000
                outputNum:
                  type: integer
                  description: 'Number of images to generate. Valid range: 1 to 10; defaults to 1.'
                  example: 1
                  minimum: 1
                  maximum: 10
                resolution:
                  type: string
                  description: 'Output resolution. Supported values: 1K only.'
                  example: 1K
                aspectRatio:
                  type: string
                  description: 'Output aspect ratio. Supported values: 1:1, 16:9, 9:16, 3:4, 4:3, 3:2, 2:3, 4:5, 5:4, 21:9.'
                  example: '1:1'
              required:
              - imageUrls
              - prompt
              example:
                imageUrls:
                - https://example.com/product.jpg
                prompt: Keep the product consistent and generate a clean white-background ecommerce hero image.
                outputNum: 1
                resolution: 1K
                aspectRatio: '1:1'
              additionalProperties: true
            example:
              imageUrls:
              - https://example.com/product.jpg
              prompt: Keep the product consistent and generate a clean white-background ecommerce hero image.
              outputNum: 1
              resolution: 1K
              aspectRatio: '1:1'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Creates a Nexscope asynchronous generation task. Use taskId with the task result endpoint to retrieve the completed output. The completed result replaces generated resource URLs with Nexscope-hosted URLs and replaces provider count with actual Nexscope credits charged.
                properties:
                  taskId:
                    type: string
                    description: Nexscope asynchronous task id used to query the generation result.
                    example: 6b3f1c61-1b7d-4a59-8a7d-3b23e4b0c9e2
                  status:
                    type: string
                    description: Task status. Initial run returns PENDING; the query endpoint may return PENDING, RUNNING, SUCCESS, FAILED, or TIMEOUT.
                    example: PENDING
                  message:
                    type: string
                    description: User-facing task state message.
                    example: The task has been created. Use taskId to query the result.
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costToken:
                    type: integer
                    description: Token cost reported by the upstream provider.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                required:
                - taskId
                - status
                example:
                  taskId: 6b3f1c61-1b7d-4a59-8a7d-3b23e4b0c9e2
                  status: PENDING
                  message: The task has been created. Use taskId to query the result.
                additionalProperties: true
              example:
                taskId: 6b3f1c61-1b7d-4a59-8a7d-3b23e4b0c9e2
                status: PENDING
                message: The task has been created. Use taskId to query the result.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: banana-image-generation
      x-nexscope-mcp-tool-name: nexscope_banana_image_generation
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
