                    items: {}
                    description: Prime price (time=timestamp, value=Prime price)
                    example: []
                  priceFba:
                    type: array
                    items: {}
                    description: FBA price (time=timestamp, value=FBA price)
                    example: []
                  priceFbm:
                    type: array
                    items: {}
                    description: FBM price (time=timestamp, value=FBM price)
                    example: []
                  priceCoupon:
                    type: array
