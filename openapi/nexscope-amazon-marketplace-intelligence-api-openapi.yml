  /api/skill-api/v1/skills/amazon-product-detail/run:
    post:
      tags:
      - Amazon Marketplace Intelligence
      summary: Amazon Product Detail
      description: Retrieve detailed Amazon product information by ASIN, including title, images, bullet points, specifications, A+ content, pricing, ratings & reviews, variants, and more.
      operationId: runAmazonProductDetail
      externalDocs:
        description: Amazon Product Detail documentation
        url: https://www.nexscope.ai/api-docs/amazon-product-detail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-product-detail.
              properties:
                asins:
                  type: string
                  description: 'ASIN list, supports batch query, up to 40 ASINs. Format: ^[A-Z0-9]+(,[A-Z0-9]+){0,39}$. Example: B072MQ5BRX,B08N5WRWNW'
                  example: B072MQ5BRX
                amazonDomain:
                  type: string
                  description: 'Amazon country site, default amazon.com. Options: amazon.com, amazon.co.uk, amazon.de, amazon.fr, amazon.it, amazon.es, amazon.co.jp, amazon.ca, amazon.com.au, amazon.com.br, amazon.in, amazon.nl, amazon.se, amazon.pl, amazon.sg, amazon.sa, amazon.ae, amazon.com.tr, amazon.com.mx, amazon.eg, amazon.cn, amazon.com.be'
                language:
                  type: string
                  description: 'Language. Examples: en_US, de_DE, fr_FR, ja_JP, it_IT, es_ES, pt_BR, en_GB, zh_CN'
                deliveryZip:
                  type: string
                  description: 'Delivery zip code, used to get delivery-related pricing. Examples: 10001 (New York, US), 10115 (Berlin, Germany), EC1A 1BB (London, UK)'
                device:
                  type: string
                  description: 'Device type: desktop (default), mobile, tablet'
                returnBoughtTogether:
                  type: boolean
                  description: Whether to return frequently bought together items (boughtTogether), default false
                  example: false
                returnRelatedProducts:
                  type: boolean
                  description: Whether to return related product list (relatedProducts), default false
                  example: false
                returnAuthorsReviews:
                  type: boolean
                  description: Whether to return author review list (authorsReviews), default false
                  example: false
              required:
              - asins
              example:
