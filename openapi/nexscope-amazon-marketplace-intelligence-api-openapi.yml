                  example: '0'
                table:
                  type: string
                  description: Optional upstream category table selector.
                  example: nodes
                nodeLabel:
                  type: string
                  description: Category label required by operation=like.
                  example: Electronics
              example:
                marketId: '1'
                operation: lookup
                nodeId: '0'
              additionalProperties: true
