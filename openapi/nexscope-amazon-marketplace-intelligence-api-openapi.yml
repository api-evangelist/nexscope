  /api/skill-api/v1/skills/amazon-product-price-series/run:
    post:
      tags:
      - Amazon Marketplace Intelligence
      summary: Amazon Product Price Series
      description: Query Amazon product historical time-series data, including price trends, BSR (Best Sellers Rank) trends, rating changes, seller counts, and monthly sales, supporting any ASIN across multiple Amazon marketplaces. Triggered when users mention price history, price tracking, BSR history, BSR trends, historical pricing, price fluctuations, Keepa data, rank history, price drop alerts, lightning deal historical prices, Buy Box price trends, coupon prices, FBA/FBM price comparison, seller count changes, rating trends, sales history. Even if users do not explicitly mention "Keepa" or "time-series data", this skill should be triggered whenever the task involves analyzing Amazon product-level historical data (such as price, rank, or sales trends over time).
      operationId: runAmazonProductPriceSeries
      externalDocs:
        description: Amazon Product Price Series documentation
        url: https://www.nexscope.ai/api-docs/amazon-product-price-series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-product-price-series.
              properties:
                asin:
                  type: string
                  description: Amazon Standard Identification Number (ASIN), single ASIN only, max length 1000
                  example: B072MQ5BRX
                domain:
                  type: string
                  description: 'Amazon domain ID. Options: 1 (United States), 2 (United Kingdom), 3 (Germany), 4 (France), 5 (Japan), 6 (Canada), 8 (Italy), 9 (Spain), 10 (India), 11 (Mexico), 12 (Brazil)'
                  example: '1'
                days:
                  type: integer
                  description: Limit historical data to this many days, default 90, max 365
                  example: 30
                showPrice:
                  type: integer
                  description: Set to 1 to return the lowest new price curve in the market
                  example: 1
                showPriceList:
                  type: integer
                  description: Set to 1 to return the list/strikethrough price curve
                  example: 1
                showPriceDeal:
                  type: integer
                  description: Set to 1 to return the deal/flash sale price curve
                  example: 1
                showPricePrime:
                  type: integer
                  description: Set to 1 to return the Prime-exclusive new price curve
                  example: 1
                showPriceFba:
                  type: integer
                  description: Set to 1 to return the third-party FBA new price curve
                  example: 1
                showPriceFbm:
                  type: integer
                  description: Set to 1 to return the third-party FBM new price curve
                  example: 1
                showPriceCoupon:
                  type: integer
                  description: Set to 1 to return the coupon-applied Buy Box price curve
                  example: 1
                showBsrMain:
                  type: integer
                  description: Set to 1 to return the main category BSR curve
                  example: 1
                showSellerCount:
                  type: integer
                  description: Set to 1 to return the seller count curve
                  example: 1
              required:
              - asin
              - domain
              example:
                showPricePrime: 1
                showPriceList: 1
                domain: '1'
                showPriceDeal: 1
                days: 30
                asin: B072MQ5BRX
                showPrice: 1
              additionalProperties: true
            example:
              showPricePrime: 1
              showPriceList: 1
              domain: '1'
              showPriceDeal: 1
              days: 30
              asin: B072MQ5BRX
              showPrice: 1
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  asin:
                    type: string
                    description: ASIN
                    example: B072MQ5BRX
                  buyboxPrice:
                    type: array
                    items: {}
                    description: Buy Box price (time=timestamp, value=Buy Box price)
                    example: []
                  price:
                    type: array
                    items: {}
                    description: Price (time=timestamp, value=price)
                    example: []
                  priceList:
