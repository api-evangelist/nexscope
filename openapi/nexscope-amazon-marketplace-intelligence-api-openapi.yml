  /api/skill-api/v1/skills/amazon-asin-traffic-summary/run:
    post:
      tags:
      - Amazon Marketplace Intelligence
      summary: Amazon Asin Traffic Summary
      description: Use SIF (Search Intelligence Framework) data to analyze ASIN traffic source composition and exposure distribution, covering current period/previous period/newly entered/exited period comparisons.
      operationId: runAmazonAsinTrafficSummary
      externalDocs:
        description: Amazon Asin Traffic Summary documentation
        url: https://www.nexscope.ai/api-docs/amazon-asin-traffic-summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-asin-traffic-summary.
              properties:
                searchValue:
                  type: string
                  description: Search value, ASIN codes, comma-separated, max 10 ASINs, max length 1000 characters
                  example: B072MQ5BRX
                country:
                  type: string
                  description: 'Country site, default US. Options (13 total): US, UK, DE, CA, JP, FR, ES, IT, MX, AU, AE, BR, SA'
                last7d:
                  type: boolean
                  description: Whether to get last 7 days data, default true. When false, use startDate/endDate range
                  example: false
                startDate:
                  type: string
                  description: Start date yyyy-MM-dd (effective when last7d=false; if omitted, the latest system week is used)
                  example: '2025-03-01'
                endDate:
                  type: string
                  description: End date yyyy-MM-dd (paired with startDate)
                  example: '2025-03-31'
                conditions:
                  type: string
                  description: 'Condition filters, comma-separated. Options: nf (natural traffic), sp (SP ads), sb (SB regular), sbv (video ads), ad (ad traffic), acAd (SP recommendation), totalPeriod.in (new incoming traffic keywords)'
                sortBy:
                  type: string
                  description: 'Sort field. Options: totalKeywordNum (all traffic keywords), naturalKeywordNum (natural traffic keywords), brandKeywordNum (brand ad keywords), vedioKeywordNum (video ad keywords), acKeywordNum (AC recommended keywords), erKeywordNum (ER recommended keywords), trKeywordNum (TR recommended keywords), sumScore (total keyword exposure score), totalNfScore (total natural rank exposure score), totalSpSocre (total SP ad exposure score, note spelling), totalBrandScore (total brand ad exposure score), totalVedioScore (total video ad exposure score), totalAcScore (total AC recommendation exposure score), totalTrScore (total TR recommendation exposure score), totalErScore (total ER recommendation exposure score)'
                pageNum:
                  type: integer
                  description: Page number, default 1
                  example: 1
                pageSize:
                  type: integer
                  description: Results per page, min 10, max 10000, default 10000
                  example: 10
                desc:
                  type: boolean
                  description: Whether to sort descending, default true
                  example: false
              required:
              - searchValue
              example:
                last7d: true
                pageSize: 10
                desc: true
                pageNum: 1
                country: US
                searchValue: B072MQ5BRX
              additionalProperties: true
            example:
              last7d: true
              pageSize: 10
              desc: true
              pageNum: 1
              country: US
              searchValue: B072MQ5BRX
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  code:
                    type: string
                    description: Response code
                  msg:
                    type: string
                    description: Message
                  total:
                    type: integer
                    description: Number of data records actually returned
                    example: 1
                  data:
