  /api/skill-api/v1/skills/amazon-product-database-search/run:
    post:
      tags:
      - Amazon Marketplace Intelligence
      summary: Amazon Product Database Search
      description: Advanced Amazon product search and filtering powered by Keepa data, supporting multi-dimensional criteria including category, price, monthly sales, keywords, BSR rank, review count, rating, package dimensions, weight, fulfillment type, and more.
      operationId: runAmazonProductDatabaseSearch
      externalDocs:
        description: Amazon Product Database Search documentation
        url: https://www.nexscope.ai/api-docs/amazon-product-database-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.amazon-product-database-search.
              properties:
                domain:
                  type: string
                  description: 'Amazon domain ID: 1=United States, 2=United Kingdom, 3=Germany, 4=France, 5=Japan, 6=Canada, 8=Italy, 9=Spain, 10=India, 11=Mexico'
                  example: '1'
                keyword:
                  type: string
                  description: Title keyword (case-insensitive; spaces mean AND tokenization; wrap keywords containing spaces in double quotes; prefix - for exclusion; & symbol is replaced with space; up to 50 keywords, max 1000 characters)
                  example: phone case
                rootCategory:
                  type: array
                  items: {}
                  description: Root category IDs (up to 50), only include products in these root categories
                  example: []
                rootCategoryNames:
                  type: array
                  items: {}
                  description: Root category names (up to 50), used when rootCategory is empty; the system automatically looks up corresponding category IDs
                  example: []
                categoriesInclude:
                  type: array
                  items: {}
                  description: Subcategory IDs to include only (up to 50), only include products directly listed in these subcategories
                  example: []
                categoriesIncludeNames:
                  type: array
                  items: {}
                  description: 'Subcategory names to include (up to 50), used when categoriesInclude is empty; the system automatically looks up corresponding category IDs. Supports full category paths (separated by : or >) for more accurate results'
                  example: []
                categoriesExclude:
                  type: array
                  items: {}
                  description: Subcategory IDs to exclude (up to 50)
                  example: []
                categoriesExcludeNames:
                  type: array
                  items: {}
                  description: Subcategory names to exclude (up to 50), used when categoriesExclude is empty; the system automatically looks up corresponding category IDs. Supports full category paths for more accurate results
                  example: []
                currentSalesGte/currentSalesLte:
                  type: integer
                  description: Current sales rank range (lower value = better ranking)
                  example: 1
                avg90SalesGte/avg90SalesLte:
                  type: integer
                  description: 90-day average sales rank range
                  example: 1
                deltaPercent90SalesGte/deltaPercent90SalesLte:
                  type: integer
                  description: 90-day sales rank change percentage range
                  example: 1
                monthlySoldGte/monthlySoldLte:
                  type: integer
                  description: Units sold / monthly sales range
                  example: 1
                srAvgGte/srAvgLte:
                  type: integer
                  description: Historical sales rank range (positive integer, lower value = better ranking, used for the month specified by srAvgMonth)
                  example: 1
                srAvgMonth:
                  type: string
                  description: 'Historical sales rank - selected month (format: YYYYMM, e.g., 202511 for November 2025, within the last 36 months)'
                currentNewGte/currentNewLte:
                  type: integer
                  description: Current new price range (in minor currency unit)
                  example: 1
                currentBuyBoxShippingGte/currentBuyBoxShippingLte:
                  type: integer
                  description: Current Buy Box price with shipping range (in minor currency unit)
                  example: 1
                currentCountReviewsGte/currentCountReviewsLte:
                  type: integer
                  description: Current review count range
                  example: 1
                currentRatingGte/currentRatingLte:
                  type: number
                  description: Current rating range (0.0-5.0)
                  example: 1
                packageLengthGte/packageLengthLte:
                  type: integer
                  description: Package length range (mm)
                  example: 1
                packageWidthGte/packageWidthLte:
                  type: integer
                  description: Package width range (mm)
                  example: 1
                packageHeightGte/packageHeightLte:
                  type: integer
                  description: Package height range (mm)
                  example: 1
                packageWeightGte/packageWeightLte:
                  type: integer
                  description: Package weight range (grams)
                  example: 1
                brand:
                  type: array
                  items: {}
                  description: Brand (OR match)
                  example: []
                color:
                  type: array
                  items: {}
                  description: Color (OR match), filter products with specified colors
                  example: []
                size:
                  type: array
                  items: {}
                  description: Size (OR match), filter products with specified sizes
                  example: []
                availableDateGte/availableDateLte:
                  type: string
                  description: 'Product listing time range (date format: yyyy-MM-dd)'
                  example: '2026-01-01'
                buyBoxIsAmazon:
                  type: boolean
                  description: Whether the Buy Box seller is Amazon
                  example: false
                buyBoxIsFBA:
                  type: boolean
                  description: Whether the Buy Box is FBA
                  example: false
                isHazMat:
                  type: boolean
                  description: Whether it is hazardous material
                  example: false
                variationCountGte/variationCountLte:
                  type: integer
                  description: Variation count range
                  example: 1
                currentCountNewGte/currentCountNewLte:
                  type: integer
                  description: Current new offer count range
                  example: 1
                outOfStockPercentage90Gte/outOfStockPercentage90Lte:
                  type: integer
                  description: 90-day out-of-stock percentage range
                  example: 1
                singleVariation:
                  type: boolean
                  description: Return only one variation; when set to true, multi-variation products will only return one variation
                  example: false
                productType:
                  type: array
                  items: {}
                  description: 'Product type filter (default [0,1,2]): 0=standard product, 1=downloadable product, 2=eBook, 5=variant parent ASIN'
                  example: []
                history:
                  type: integer
                  description: Whether to include historical data / historical sales in the response (1=include, 0=exclude, default 0)
                  example: 1
                rating:
                  type: integer
                  description: Whether to fetch rating info (1=fetch, 0=do not fetch, default 1)
                  example: 1
                page:
                  type: integer
                  description: Page number (starting from 1, default 1)
                  example: 1
                perPage:
                  type: integer
                  description: Maximum results per page (min 50, max 100, default 50)
                  example: 50
                sort:
                  type: array
                  items: {}
                  description: 'Sort (up to 3): array of objects, each containing {"fieldName": "...", "sortDirection": "asc\'
                  example: []
              required:
              - domain
              example:
                page: 1
                perPage: 50
                domain: '1'
                keyword: phone case
              additionalProperties: true
            example:
              page: 1
              perPage: 50
              domain: '1'
              keyword: phone case
