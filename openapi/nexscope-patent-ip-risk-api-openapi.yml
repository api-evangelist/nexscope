                  - old
                type:
                  type: string
                  enum:
                  - PATENT
                  - DESIGN
                status:
                  type: string
                  enum:
                  - GRANT
                  - APPLICATION
                patents:
                  type: boolean
                  default: true
                scholar:
                  type: boolean
                  default: false
                litigation:
                  type: string
                  enum:
                  - 'YES'
                  - 'NO'
                inventor:
                  type: string
                assignee:
                  type: string
                clustered:
                  const: true
                dups:
                  const: language
