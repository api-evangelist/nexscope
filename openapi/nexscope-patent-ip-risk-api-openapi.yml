openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative Patent & IP Risk API
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Patent & IP Risk
  description: Patent, trademark, copyright and IP risk APIs.
  x-category-slug: patent-ip-risk
paths:
  /api/skill-api/v1/skills/patent-abstract-image-data/run:
    post:
      tags:
      - Patent & IP Risk
      summary: Patent Abstract Image Data
      description: Retrieves patent abstract images (drawings) from the Zhihuiya (PatSnap) patent database by patent ID or publication number.
      operationId: runPatentAbstractImageData
      externalDocs:
        description: Patent Abstract Image Data documentation
        url: https://www.nexscope.ai/api-docs/patent-abstract-image-data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.patent-abstract-image-data.
              properties:
                patentId:
                  type: string
                  description: Patent ID. At least one of patentId and patentNumber must be provided. If both are present, patentId takes precedence. Only a single value is supported; multiple values separated by commas are not allowed. Max length 60000 characters.
                patentNumber:
                  type: string
                  description: Publication/announcement number. At least one of patentId and patentNumber must be provided. If both are present, patentId takes precedence. Only a single value is supported; multiple values separated by commas are not allowed. Max length 60000 characters.
                  example: US11299876B2
              example:
                patentNumber: US11299876B2
              additionalProperties: true
            example:
              patentNumber: US11299876B2
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  total:
                    type: integer
                    description: Record count
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        patentId:
                          type: string
                          description: Patent ID
                          example: example-id
                        pn:
                          type: string
                          description: Publication (announcement) number
                        abstractDrawingPath:
                          type: string
                          description: Abstract image download path
                      additionalProperties: true
                    description: List of patent abstract image results
                    example: []
                  columns:
                    type: array
                    items: {}
                    description: Rendered column definitions
                    example: []
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  type:
                    type: string
                    description: Rendered style
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  total: 1
                  data:
                  - patentId: example-id
                  columns: []
                  costToken: 1
                additionalProperties: true
              example:
                total: 1
                data:
                - patentId: example-id
                columns: []
                costToken: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: patent-abstract-image-data
      x-nexscope-mcp-tool-name: nexscope_patent_abstract_image_data
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/patent-claims/run:
    post:
      tags:
      - Patent & IP Risk
      summary: Patent Claims
      description: Retrieves patent claims data from Zhihuiya (PatSnap).
      operationId: runPatentClaims
      externalDocs:
        description: Patent Claims documentation
        url: https://www.nexscope.ai/api-docs/patent-claims
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.patent-claims.
              properties:
                patentId:
                  type: string
                  description: PatSnap internal patent ID. Only a single value is supported; multiple values separated by commas are not allowed. Max length 60000 characters
                patentNumber:
                  type: string
                  description: Publication/announcement number. Only a single value is supported; multiple values separated by commas are not allowed. Max length 60000 characters
                  example: US11299876B2
                replaceByRelated:
                  type: string
                  description: 'Whether to substitute with a family patent''s claims when the current patent''s claims are unavailable: 1 yes, 0 no. Max length 1000 characters'
              example:
                patentNumber: US11299876B2
              additionalProperties: true
            example:
              patentNumber: US11299876B2
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  total:
                    type: integer
                    description: Record count
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        patentId:
                          type: string
                          description: Patent ID
                          example: example-id
                        pn:
                          type: string
                          description: Publication (announcement) number
                        pnRelated:
                          type: string
                          description: Publication number of the substitute patent (only provided when a family patent substitute is used)
                        claims:
                          type: array
                          items: {}
                          description: Claims array, containing claim text and metadata
                          example: []
                        claimCount:
                          type: integer
                          description: Number of claims
                          example: 1
                      additionalProperties: true
                    description: Patent list (see below)
                    example: []
                  columns:
                    type: array
                    items: {}
                    description: Rendered column definitions
                    example: []
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  type:
                    type: string
                    description: Rendered style
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  total: 1
                  data:
                  - patentId: example-id
                    claims: []
                    claimCount: 1
                  columns: []
                  costToken: 1
                additionalProperties: true
              example:
                total: 1
                data:
                - patentId: example-id
                  claims: []
                  claimCount: 1
                columns: []
                costToken: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: patent-claims
      x-nexscope-mcp-tool-name: nexscope_patent_claims
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
  /api/skill-api/v1/skills/patent-cited-by/run:
    post:
      tags:
      - Patent & IP Risk
      summary: Patent Cited By
      description: Returns cited-by counts and citing patent records for up to 100 patents.
      operationId: runPatentCitedBy
      externalDocs:
        description: Patent Cited By documentation
        url: https://www.nexscope.ai/api-docs/patent-cited-by
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide patentId or patentNumber. A request may contain at most 100 comma-separated patents.
              properties:
                patentId:
                  type: string
                  description: One or up to 100 comma-separated PatSnap patent IDs. Takes precedence when both identifiers are provided.
                  example: patent-id
                patentNumber:
                  type: string
                  description: One or up to 100 comma-separated publication or grant numbers.
                  example: US10123456B2
              example:
                patentNumber: US10123456B2
              additionalProperties: true
            example:
              patentNumber: US10123456B2
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the PatSnap cited-by payload directly.
                properties:
                  total:
                    type: integer
                    description: Number of returned patent records.
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        patentId:
                          type: string
                          description: Queried patent ID.
                          example: patent-id
                        pn:
                          type: string
                          description: Queried publication number.
                          example: US10123456B2
                        citedBy3y:
                          type: integer
                          description: Citations received within three years.
                          example: 1
                        citedBy5y:
                          type: integer
                          description: Citations received within five years.
                          example: 1
                        citedByPatents:
                          type: array
                          items: {}
                          description: Patents that cite the queried patent.
                          example: []
                      additionalProperties: true
                    description: Cited-by results.
                    example: []
                  columns:
                    type: array
                    items: {}
                    description: Provider rendering columns.
                    example: []
                  costToken:
                    type: integer
                    description: Provider-reported token cost.
                    example: 6000
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  type:
                    type: string
                    description: Provider-specific render or payload type.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  total: 1
                  data:
                  - patentId: patent-id
                    pn: US10123456B2
                    citedBy3y: 1
                    citedBy5y: 1
                    citedByPatents: []
                  columns: []
                  costToken: 6000
                additionalProperties: true
              example:
                total: 1
                data:
                - patentId: patent-id
                  pn: US10123456B2
                  citedBy3y: 1
                  citedBy5y: 1
                  citedByPatents: []
                columns: []
                costToken: 6000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: patent-cited-by
      x-nexscope-mcp-tool-name: nexscope_patent_cited_by
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
