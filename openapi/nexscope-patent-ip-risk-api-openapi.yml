  /api/skill-api/v1/skills/patent-core-bibliography/run:
    post:
      tags:
      - Patent & IP Risk
      summary: Patent Core Bibliography
      description: Returns titles, abstracts, identifiers, dates, applicants, inventors, assignees, and classifications.
      operationId: runPatentCoreBibliography
      externalDocs:
        description: Patent Core Bibliography documentation
        url: https://www.nexscope.ai/api-docs/patent-core-bibliography
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide patentId or patentNumber. A request may contain at most 100 comma-separated patents.
              properties:
                patentId:
                  type: string
                  description: One or up to 100 comma-separated PatSnap patent IDs. Takes precedence when both identifiers are provided.
                  example: patent-id
                patentNumber:
                  type: string
                  description: One or up to 100 comma-separated publication or grant numbers.
                  example: US10123456B2
              example:
                patentNumber: US10123456B2
              additionalProperties: true
            example:
              patentNumber: US10123456B2
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the PatSnap bibliography payload directly.
                properties:
                  total:
                    type: integer
                    description: Number of returned records.
                    example: 1
                  allRecordsCount:
                    type: integer
                    description: Total matching record count.
                    example: 1
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        patentId:
                          type: string
                          description: Patent ID.
                          example: patent-id
                        title:
                          type: string
                          description: Patent title.
                          example: Wireless speaker system
                        abstractContent:
                          type: string
                          description: Patent abstract.
                          example: A wireless speaker system...
                        publicationNumber:
                          type: string
                          description: Publication number.
                          example: US10123456B2
                        applicationNo:
                          type: string
                          description: Application number.
                          example: US15/123456
                        applicants:
                          type: array
                          items: {}
                          description: Applicants.
                          example: []
                        inventors:
                          type: array
                          items: {}
                          description: Inventors.
                          example: []
                        assignees:
                          type: array
                          items: {}
                          description: Assignees.
                          example: []
                        ipcFurther:
                          type: array
                          items: {}
                          description: IPC classifications.
                          example: []
                      additionalProperties: true
                    description: Bibliographic patent records.
                    example: []
                  columns:
                    type: array
                    items: {}
                    description: Provider rendering columns.
                    example: []
