  /api/skill-api/v1/skills/zhihuiya-patent-image-search/run:
    post:
      tags:
      - Patent & IP Risk
      summary: Zhihuiya Patent Image Search
      description: Perform visual similarity search for design patents using an image URL, with filtering by country, legal status, date ranges, Locarno classification, and assignee. Supports design patent types only (type D). Triggered when users mention patent image search, design patent search, search patent by image, visual patent lookup, patent similarity detection, patent image matching, or design patent infringement check. Even if the user does not explicitly mention "patent image," this skill should be triggered whenever the need involves searching for similar design patents through an image. For utility model patents, use ecommerce.zhihuiya-utility-patent-image-search instead.
      operationId: runZhihuiyaPatentImageSearch
      externalDocs:
        description: Zhihuiya Patent Image Search documentation
        url: https://www.nexscope.ai/api-docs/zhihuiya-patent-image-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.zhihuiya-patent-image-search.
              properties:
                url:
                  type: string
                  description: Image URL (maximum 1,000 characters)
                  example: https://m.media-amazon.com/images/I/719mRAn2VrL._AC_SL1500_.jpg
                patentType:
                  type: string
                  description: 'Patent type: D for a design patent or U for a utility model patent. Default: D'
                  example: D
                model:
                  type: integer
                  description: 'Image-search model. Design patents: 1 (smart association, recommended) or 2 (search this image). Utility model patents: 3 (match shape) or 4 (match shape, pattern, and color; recommended)'
                  example: 1
                country:
                  type: string
                  description: Patent authority codes for countries, organizations, or regions, separated by commas, for example CN,US,JP. Omit to search all patent authorities
                loc:
                  type: string
                  description: LOC classifications (Locarno classification numbers). Join multiple classifications with AND, OR, or NOT
                legalStatus:
                  type: string
                  description: 'Comma-separated patent legal-status codes. Values: 1 (published), 2 (substantive examination), 3 (granted), 8 (duplicate-grant avoidance), 11 (withdrawn), 12 (withdrawn-unspecified), 17 (deemed withdrawn), 18 (voluntarily withdrawn), 13 (rejected), 14 (fully revoked), 15 (expired), 16 (annual fee unpaid), 21 (rights restored), 22 (rights terminated), 23 (partially invalid), 24 (application terminated), 30 (abandoned), 19 (deemed abandoned), 20 (voluntarily abandoned), 25 (abandoned-unspecified), 222 (PCT did not enter designated state within designation period), 223 (PCT entered designated state within designation period), 224 (PCT entered designated state after designation period), and 225 (PCT did not enter designated state after designation period)'
                simpleLegalStatus:
                  type: string
                  description: 'Comma-separated simplified patent legal-status codes. Values: 0 (inactive), 1 (active), 2 (pending), 220 (PCT designation period expired), 221 (within PCT designation period), and 999 (unconfirmed)'
                assignees:
                  type: string
                  description: Applicant or patent owner (maximum 1,000 characters)
                applyStartTime:
                  type: string
                  description: Patent application start date in yyyyMMdd format
                applyEndTime:
                  type: string
                  description: Patent application end date in yyyyMMdd format
                publicStartTime:
                  type: string
                  description: Patent publication start date in yyyyMMdd format
                publicEndTime:
                  type: string
                  description: Patent publication end date in yyyyMMdd format
                limit:
                  type: integer
                  description: 'Number of patents to return, from 1 to 100. Default: 10'
                  example: 5
                offset:
                  type: integer
                  description: 'Result offset, from 0 to 1,000. Default: 0'
                  example: 0
                field:
                  type: string
                  description: 'Result sort field: SCORE (relevance), APD (application date), PBD (publication date), or ISD (grant date). Default: SCORE'
                order:
                  type: string
                  description: 'Available when field is APD, PBD, or ISD: desc (descending) or asc (ascending). Default: desc'
                lang:
                  type: string
                  description: 'Preferred title language: original (original patent title), cn (Chinese-translated title), or en (English-translated title). Default: original'
                preFilter:
                  type: integer
                  description: 'Whether to enable country/LOC pre-filtering: 1 for enabled and 0 for disabled. Default: 1'
                  example: 1
                stemming:
                  type: integer
                  description: 'Whether to enable stemming: 1 for enabled and 0 for disabled. Default: 0'
                  example: 0
                mainField:
                  type: string
                  description: Primary patent fields, including title, abstract, claims, specification, publication number, application number, applicant, inventor, and IPC/UPC/LOC classifications (maximum 1,000 characters)
                includeMachineTranslation:
                  type: boolean
                  description: Include machine-translated data in the search
                  example: false
                scoreExpansion:
                  type: boolean
                  description: Score expansion
                  example: false
                isHttps:
                  type: integer
                  description: 'Whether to return images over HTTPS: 1 for HTTPS and 0 for HTTP. Default: 0'
                  example: 1
                returnImgId:
                  type: boolean
                  description: 'Whether to return img_id. Default: false'
                  example: false
              required:
              - url
              - patentType
              - model
              example:
                country: US
                url: https://m.media-amazon.com/images/I/719mRAn2VrL._AC_SL1500_.jpg
                patentType: D
                model: 1
                preFilter: 1
                isHttps: 1
                limit: 5
                stemming: 0
                offset: 0
              additionalProperties: true
