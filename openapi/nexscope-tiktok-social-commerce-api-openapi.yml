    post:
      tags:
      - TikTok / Social Commerce
      summary: TikTok Shop Product Detail
      description: Returns normalized public ecommerce research data with a fixed read-only provider path.
      operationId: runTiktokShopProductDetail
      externalDocs:
        description: TikTok Shop Product Detail documentation
        url: https://www.nexscope.ai/api-docs/tiktok-shop-product-detail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - productInput
              properties:
                productInput:
                  type: string
                  oneOf:
                  - pattern: ^\d{19}$
                  - format: uri
                    pattern: ^https://(?:[A-Za-z0-9-]+\.)*tiktok\.com(?::443)?/(?:.*/)?product/\d{19}(?:[/?#].*)?$
                region:
                  type: string
                  enum:
                  - US
                  - GB
                  - ID
                  - MY
                  - TH
                  - VN
                  - PH
                  - SG
                  - DE
                  - FR
                  - IT
                  - ES
                  default: US
              description: Request parameters documented by ecommerce.tiktok-shop-product-detail.
              example:
                productInput: '1729937400435937604'
                region: US
            example:
              productInput: '1729937400435937604'
              region: US
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - product
                properties:
                  product:
                    type: object
                    additionalProperties: true
                    required:
                    - productId
                    properties:
                      productId:
                        type: string
                        pattern: ^\d{19}$
                      title:
                        type: string
                      seller:
                        type: object
                      pricing:
                        type: object
                      sales:
                        type: object
                      inventory:
                        type: object
                      media:
                        type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
              example:
                product:
                  productId: '1729937400435937604'
                  title: Example TikTok Shop product
                  seller:
                    name: CARER SPARK
        '400':
          ? ''
          : '#/components/responses/BadRequest'
        '401':
          ? ''
          : '#/components/responses/Unauthorized'
        '403':
          ? ''
          : '#/components/responses/Forbidden'
        '429':
          ? ''
          : '#/components/responses/TooManyRequests'
        '500':
          ? ''
          : '#/components/responses/ServerError'
      x-nexscope-slug: tiktok-shop-product-detail
      x-nexscope-mcp-tool-name: nexscope_tiktok_shop_product_detail
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
components:
  responses:
    ServerError:
