openapi: 3.2.0
info:
  title: Nexscope Ecommerce Data and Creative 1688 Sourcing API
  version: 2026-08-28-public-catalog-v1
  description: Nexscope APIs provide ecommerce marketplace intelligence and creative generation capabilities through REST and MCP. Authentication uses a Nexscope API key. Pricing is credit-based and actual usage varies by endpoint and workload; current estimates are shown in the Nexscope account.
  termsOfService: https://www.nexscope.ai/terms
  contact:
    name: Nexscope Support
    email: service@nexscope.ai
    url: https://www.nexscope.ai/api-docs
  license:
    name: Proprietary API; use subject to Nexscope Terms
    url: https://www.nexscope.ai/terms
servers:
- url: https://api.nexscope.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: 1688 Sourcing
  description: 1688 product search, image search and billboard sourcing APIs.
  x-category-slug: 1688-sourcing
paths:
  /api/skill-api/v1/skills/1688-product-billboard/run:
    post:
      tags:
      - 1688 Sourcing
      summary: 1688 Product Billboard
      description: Query 1688 product bestseller billboard data for sourcing discovery and wholesale product research.
      operationId: run1688ProductBillboard
      externalDocs:
        description: 1688 Product Billboard documentation
        url: https://www.nexscope.ai/api-docs/1688-product-billboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.1688-product-billboard.
              properties:
                keyWord:
                  type: string
                  description: Product search keyword (must be written in Simplified Chinese; translate it before calling this API). Maximum 50 characters
                  example: iPhone 15
                date:
                  type: string
                  description: 'Query time. Weekly chart: pass the Sunday date of that week, e.g. 2025-06-15 (up to 90 days); Monthly chart: pass the first day of the month, e.g. 2025-06-01 (up to one year)'
                  example: '2026-07-01'
                pageType:
                  type: integer
                  description: 'Billboard type: 2 = weekly, 3 = monthly. Default 3'
                  example: 3
                pageIndex:
                  type: integer
                  description: Page number (starting from 1), default 1
                  example: 1
                pageSize:
                  type: integer
                  description: Number of results per page (10-100), default 20
                  example: 10
                sortField:
                  type: string
                  description: 'Sort field, default orderCount. Options: orderCount (order count), saleCount (units sold), saleVolume (estimated sales amount), offerCreateTime (listing time), price (wholesale price), consignPrice (dropship price)'
                sortType:
                  type: string
                  description: 'Sort order: desc (descending), asc (ascending), default desc'
                searchType:
                  type: integer
                  description: 'Product keyword search type: 1 = fuzzy match, 3 = exact match. Default 1'
                  example: 1
                offerType:
                  type: integer
                  description: 'Product tag: 0 = no limit, 2 = new product, 3 = 1688 Select, 4 = cross-border, 5 = customization supported, 6 = store highlight. Default 0'
                  example: 1
                companyType:
                  type: integer
                  description: 'Company type: 0 = no limit, 1 = store, 2 = factory'
                  example: 1
                shiLiType:
                  type: string
                  description: 'Seller membership type (multi-select), comma-separated. Options: superFactory (Super Factory), Power (Power Seller), TrustPass (TrustPass member only)'
                beginTpYear:
                  type: integer
                  description: Start TrustPass years
                  example: 1
                endTpYear:
                  type: integer
                  description: End TrustPass years
                  example: 1
                beginPrice:
                  type: number
                  description: Wholesale price (start)
                  example: 1
                endPrice:
                  type: number
                  description: Wholesale price (end)
                  example: 1
                beginConsignPrice:
                  type: number
                  description: Dropship price (start)
                  example: 1
                endConsignPrice:
                  type: number
                  description: Dropship price (end)
                  example: 1
                beginOrderCount:
                  type: integer
                  description: Order count (start)
                  example: 1
                endOrderCount:
                  type: integer
                  description: Order count (end)
                  example: 1
                beginSaleCount:
                  type: integer
                  description: Units sold (start)
                  example: 1
                endSaleCount:
                  type: integer
                  description: Units sold (end)
                  example: 1
                beginSaleVolume:
                  type: number
                  description: Sales amount (start)
                  example: 1
                endSaleVolume:
                  type: number
                  description: Sales amount (end)
                  example: 1
                beginStartQuantity:
                  type: integer
                  description: Minimum order quantity (start)
                  example: 1
                endStartQuantity:
                  type: integer
                  description: Minimum order quantity (end)
                  example: 1
                beginOfferCreateTime:
                  type: string
                  description: 'Listing time (start), format: YYYY-MM-DD'
                endOfferCreateTime:
                  type: string
                  description: 'Listing time (end), format: YYYY-MM-DD'
                sendTime:
                  type: string
                  description: 'Delivery time (multi-select), comma-separated. Options: 24 (24 hours), 48 (48 hours), 72 (72 hours)'
                proxyRights:
                  type: string
                  description: 'Dropship rights (multi-select), comma-separated. Options: 4360897 (one-piece dropship with free shipping), 449154 (procure now, pay later)'
                shopService:
                  type: string
                  description: 'Seller services (multi-select), comma-separated. Options: 4057409 (Safe Buy), 888777 (Deep Verification Report)'
                buyerProtections:
                  type: string
                  description: 'Buyer protections, comma-separated: free shipping, 7-day free return, or shipping insurance'
                faceToFaceSupport:
                  type: string
                  description: 'Waybill support (multi-select), comma-separated. Options: 441218 (Taobao), 386434 (Douyin), 422914 (Pinduoduo), 422978 (Xiaohongshu), 386370 (Kuaishou)'
                productIds:
                  type: string
                  description: Product IDs, separated by Chinese comma for multiple, max 20
                goodsUrl:
                  type: string
                  description: Product link URL
                  example: https://example.com/image.jpg
              example:
                pageIndex: 1
                searchType: 1
                pageType: 3
                pageSize: 10
                date: '2026-07-01'
                keyWord: iPhone 15
              additionalProperties: true
            example:
              pageIndex: 1
              searchType: 1
              pageType: 3
              pageSize: 10
              date: '2026-07-01'
              keyWord: iPhone 15
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  total:
                    type: integer
                    description: Total record count
                    example: 1
