  /api/skill-api/v1/skills/1688-search-by-image/run:
    post:
      tags:
      - 1688 Sourcing
      summary: 1688 Search By Image
      description: Perform image-based product search on the 1688 platform. Use an image URL to find visually similar supplier products, returning title, price, minimum order quantity, monthly sales, repurchase rate, trade score, and seller identity. Triggered when users mention 1688 image search, 1688 visual search, find supplier by image, reverse image search 1688, 1688 product sourcing by image, or Alibaba 1688 image search. Even if the user does not explicitly mention "image search," this skill should be triggered whenever a user provides an image URL and wants to find matching or similar products on the 1688 wholesale platform.
      operationId: run1688SearchByImage
      externalDocs:
        description: 1688 Search By Image documentation
        url: https://www.nexscope.ai/api-docs/1688-search-by-image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request parameters documented by ecommerce.1688-search-by-image.
              properties:
                imageUrl:
                  type: string
                  description: 'Valid, publicly accessible image URL (maximum 1,000 characters). Supported formats: PNG, JPG, and JPEG; WEBP and GIF are not supported. Provide exactly one of imageUrl, imageBase64, or imageId'
                  example: https://m.media-amazon.com/images/I/61v6nYvQ7+L._AC_SL1500_.jpg
                imageBase64:
                  type: string
                  description: 'Raw Base64-encoded image content without a data:image/jpeg;base64, prefix. Supported formats: PNG, JPG, and JPEG. Use when imageUrl is omitted'
                imageId:
                  type: string
                  description: 1688 image ID. Image-search results also return this value; include it when page is greater than 1 to improve response time
                page:
                  type: integer
                  description: Page number starting from 1
                  example: 1
                pageSize:
                  type: integer
                  description: Number of products per page, maximum 50
                  example: 10
                priceStart:
                  type: string
                  description: Minimum price in CNY, for example 10
                priceEnd:
                  type: string
                  description: Maximum price in CNY, for example 100
                filter:
                  type: string
                  description: Comma-separated filter conditions. Use the supported filter values documented for this endpoint
                sort:
                  type: string
                  description: 'Sort condition as JSON in the form {field: direction}. Fields: price, rePurchaseRate, or monthSold. Directions: asc or desc'
                keyword:
                  type: string
                  description: Keyword used to search within the results
                  example: phone case
                productCollectionId:
                  type: string
                  description: Single product-collection ID. Use a supported collection ID documented for this endpoint
                  example: example-id
              example:
                page: 1
                pageSize: 10
                imageUrl: https://m.media-amazon.com/images/I/61v6nYvQ7+L._AC_SL1500_.jpg
              additionalProperties: true
            example:
              page: 1
              pageSize: 10
              imageUrl: https://m.media-amazon.com/images/I/61v6nYvQ7+L._AC_SL1500_.jpg
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: Returns the documented upstream API response directly without an additional wrapper.
                properties:
                  imageId:
                    type: string
                    description: Uploaded image ID; send it with paginated requests to improve response time
                    example: example-id
                  total:
                    type: integer
                    description: Number of products on this page
                    example: 1
                  totalPage:
                    type: integer
                    description: Total number of pages
                    example: 1
                  sourceType:
                    type: string
                    description: Source type; fixed value "1688"
                  type:
                    type: string
                    description: Rendering style; fixed value "productWorkbenches"
                  columns:
                    type: array
                    items: {}
                    description: Column definitions used for rendering
                    example: []
                  costToken:
                    type: integer
                    description: Tokens consumed
                    example: 1
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        isOnePsale:
                          type: string
                          description: Whether single-item dropshipping is available
