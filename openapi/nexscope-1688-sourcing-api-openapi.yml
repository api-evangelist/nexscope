                          example: 1
                        quantityPrices:
                          type: string
                          description: Price range
                        salesOrderCount:
                          type: integer
                          description: Order count (returns corresponding value based on statistical period)
                          example: 1
                        salesQuantity:
                          type: integer
                          description: Units sold (returns corresponding value based on statistical period)
                          example: 1
                        estimatedSalesAmount:
                          type: integer
                          description: Estimated sales amount (returns corresponding value based on statistical period)
                          example: 1
                        dataType:
                          type: string
                          description: 'Data type: weeklyData = weekly data, monthlyData = monthly data'
                        availableDate:
                          type: string
                          description: Product listing time, format yyyy-MM-dd HH:mm:ss
                          example: '2026-01-01'
                        deliveryTime:
                          type: string
                          description: Delivery time
                        levelName:
                          type: string
                          description: Category hierarchy name
                        company:
                          type: string
                          description: Store name
                        shopId:
                          type: string
                          description: Store ID
                          example: example-id
                        shopUrl:
                          type: string
                          description: Store link URL
                          example: https://example.com/image.jpg
                        asinUrl:
                          type: string
                          description: Product link URL
                          example: B072MQ5BRX
                        imageUrl:
                          type: string
                          description: Image URL
                          example: https://example.com/image.jpg
                        sourceType:
                          type: string
                          description: Source platform (1688)
                        sourceTool:
                          type: string
                          description: Source tool
                      additionalProperties: true
                    description: Product list (see Product Object below)
                    example: []
                  errcode:
                    type: integer
                    description: Upstream status code returned by the provider.
                  errmsg:
                    type: string
                    description: Upstream status message returned by the provider.
                  code:
                    type: string
                    description: Provider-specific status code.
                  msg:
                    type: string
                    description: Provider-specific status message.
                  message:
                    type: string
                    description: Provider-specific message.
                  title:
                    type: string
                    description: Provider-specific response title.
                  sourceType:
                    type: string
                    description: Provider-specific source platform type.
                  sourceTool:
                    type: string
                    description: Provider-specific source tool name.
                  costToken:
                    type: integer
                    description: Token cost reported by the upstream provider.
                  costTime:
                    type: integer
                    description: Execution time reported by the upstream provider.
                  page:
                    type: integer
                    description: Current page returned by the upstream provider.
                  pageSize:
                    type: integer
                    description: Page size returned by the upstream provider.
                  pageItemCount:
                    type: integer
                    description: Item count on the current page returned by the upstream provider.
                  totalPage:
                    type: integer
                    description: Total page count returned by the upstream provider.
                  dataSnapshotMonth:
                    type: string
                    description: Data snapshot month returned by the upstream provider.
                example:
                  total: 1
                  columns: []
                  products:
                  - offerId: example-id
                    asin: B072MQ5BRX
                    price: 1
                    consignPrice: 1
                    quantityBegin: 1
                    salesOrderCount: 1
                    salesQuantity: 1
                    estimatedSalesAmount: 1
                    availableDate: '2026-01-01'
                    shopId: example-id
                    shopUrl: https://example.com/image.jpg
                    asinUrl: B072MQ5BRX
                    imageUrl: https://example.com/image.jpg
                additionalProperties: true
              example:
                total: 1
                columns: []
                products:
                - offerId: example-id
                  asin: B072MQ5BRX
                  price: 1
                  consignPrice: 1
                  quantityBegin: 1
                  salesOrderCount: 1
                  salesQuantity: 1
                  estimatedSalesAmount: 1
                  availableDate: '2026-01-01'
                  shopId: example-id
                  shopUrl: https://example.com/image.jpg
                  asinUrl: B072MQ5BRX
                  imageUrl: https://example.com/image.jpg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      x-nexscope-slug: 1688-product-billboard
      x-nexscope-mcp-tool-name: nexscope_1688_product_billboard
      x-nexscope-pricing-mode: dynamic-credits
      x-nexscope-catalog-derived: true
